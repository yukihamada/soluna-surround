<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="ui-monospace,Menlo,monospace">
  <defs>
    <radialGradient id="glow" cx="0.05" cy="0.5" r="1">
      <stop offset="0" stop-color="#d4af37" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="field"><rect x="0" y="0" width="760" height="400" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="760" height="400" rx="12" fill="#17100f"/>
  <rect x="0" y="0" width="760" height="400" rx="12" fill="url(#glow)"/>

  <!-- title -->
  <text x="24" y="34" fill="#f2e7d3" font-size="15" font-weight="bold">各ノードは、ステージ音の波面が届いた瞬間に鳴る</text>
  <text x="24" y="54" fill="#a8977e" font-size="11">delay = distance / 343 m/s + 15 ms (Haas)</text>

  <g clip-path="url(#field)">
    <!-- house PA coverage (front) -->
    <path d="M 58 190 L 210 70 L 210 310 Z" fill="#d4af37" fill-opacity=".06"/>
    <text x="140" y="196" fill="#d4af37" font-size="10" text-anchor="middle" opacity=".85">FRONT</text>
    <text x="140" y="210" fill="#a8977e" font-size="9" text-anchor="middle">house PA</text>

    <!-- expanding wavefront (343 m/s) -->
    <circle cx="41" cy="190" r="0" fill="none" stroke="#d4af37" stroke-width="2.5" opacity="0">
      <animate attributeName="r" dur="4.2s" repeatCount="indefinite" begin="0s"
               keyTimes="0;0.762;1" values="0;640;640"/>
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" begin="0s"
               keyTimes="0;0.05;0.6;0.8;1" values="0;0.7;0.4;0;0"/>
    </circle>
    <!-- faint second wave for continuity -->
    <circle cx="41" cy="190" r="0" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0">
      <animate attributeName="r" dur="4.2s" repeatCount="indefinite" begin="0.5s"
               keyTimes="0;0.762;1" values="0;640;640"/>
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" begin="0.5s"
               keyTimes="0;0.05;0.6;0.8;1" values="0;0.28;0.16;0;0"/>
    </circle>
  </g>

  <!-- stage -->
  <rect x="24" y="120" width="34" height="140" rx="6" fill="#d4af37"/>
  <text x="41" y="282" fill="#d4af37" font-size="11" text-anchor="middle">STAGE</text>
  <text x="41" y="296" fill="#a8977e" font-size="9" text-anchor="middle">house PA + sub</text>

  <!-- zone letters -->
  <g font-size="13" text-anchor="middle" font-weight="bold">
    <text x="230" y="86" fill="#e3c05e">B</text>
    <text x="330" y="86" fill="#cfa94a">C</text>
    <text x="430" y="86" fill="#b8923c">D</text>
    <text x="530" y="86" fill="#9d7c33">E</text>
    <text x="630" y="86" fill="#82672b">F</text>
  </g>

  <!-- grid nodes (static dots) -->
  <g fill="#f0d47a">
    <circle cx="230" cy="115" r="5"/><circle cx="230" cy="190" r="5"/><circle cx="230" cy="265" r="5"/>
  </g>
  <g fill="#e0bc55">
    <circle cx="330" cy="115" r="5"/><circle cx="330" cy="190" r="5"/><circle cx="330" cy="265" r="5"/>
  </g>
  <g fill="#c9a648">
    <circle cx="430" cy="115" r="5"/><circle cx="430" cy="190" r="5"/><circle cx="430" cy="265" r="5"/>
  </g>
  <g fill="#b0913e">
    <circle cx="530" cy="115" r="5"/><circle cx="530" cy="190" r="5"/><circle cx="530" cy="265" r="5"/>
  </g>
  <g fill="#977c35">
    <circle cx="630" cy="115" r="5"/><circle cx="630" cy="190" r="5"/><circle cx="630" cy="265" r="5"/>
  </g>

  <!-- node fire rings: begin = wavefront arrival at that column -->
  <!-- col B: arrival 0.95s -->
  <g fill="none" stroke="#7fc9a2" stroke-width="2">
    <circle cx="230" cy="115" r="0" opacity="0">
      <animate attributeName="r" dur="4.2s" repeatCount="indefinite" begin="0.95s" keyTimes="0;0.19;1" values="6;30;30"/>
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" begin="0.95s" keyTimes="0;0.19;1" values="0.95;0;0"/>
    </circle>
    <circle cx="230" cy="190" r="0" opacity="0">
      <animate attributeName="r" dur="4.2s" repeatCount="indefinite" begin="0.95s" keyTimes="0;0.19;1" values="6;30;30"/>
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" begin="0.95s" keyTimes="0;0.19;1" values="0.95;0;0"/>
    </circle>
    <circle cx="230" cy="265" r="0" opacity="0">
      <animate attributeName="r" dur="4.2s" repeatCount="indefinite" begin="0.95s" keyTimes="0;0.19;1" values="6;30;30"/>
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" begin="0.95s" keyTimes="0;0.19;1" values="0.95;0;0"/>
    </circle>
    <!-- col C: 1.45s -->
    <circle cx="330" cy="115" r="0" opacity="0">
      <animate attributeName="r" dur="4.2s" repeatCount="indefinite" begin="1.45s" keyTimes="0;0.19;1" values="6;30;30"/>
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" begin="1.45s" keyTimes="0;0.19;1" values="0.95;0;0"/>
    </circle>
    <circle cx="330" cy="190" r="0" opacity="0">
      <animate attributeName="r" dur="4.2s" repeatCount="indefinite" begin="1.45s" keyTimes="0;0.19;1" values="6;30;30"/>
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" begin="1.45s" keyTimes="0;0.19;1" values="0.95;0;0"/>
    </circle>
    <circle cx="330" cy="265" r="0" opacity="0">
      <animate attributeName="r" dur="4.2s" repeatCount="indefinite" begin="1.45s" keyTimes="0;0.19;1" values="6;30;30"/>
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" begin="1.45s" keyTimes="0;0.19;1" values="0.95;0;0"/>
    </circle>
    <!-- col D: 1.95s -->
    <circle cx="430" cy="115" r="0" opacity="0">
      <animate attributeName="r" dur="4.2s" repeatCount="indefinite" begin="1.95s" keyTimes="0;0.19;1" values="6;30;30"/>
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" begin="1.95s" keyTimes="0;0.19;1" values="0.95;0;0"/>
    </circle>
    <circle cx="430" cy="190" r="0" opacity="0">
      <animate attributeName="r" dur="4.2s" repeatCount="indefinite" begin="1.95s" keyTimes="0;0.19;1" values="6;30;30"/>
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" begin="1.95s" keyTimes="0;0.19;1" values="0.95;0;0"/>
    </circle>
    <circle cx="430" cy="265" r="0" opacity="0">
      <animate attributeName="r" dur="4.2s" repeatCount="indefinite" begin="1.95s" keyTimes="0;0.19;1" values="6;30;30"/>
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" begin="1.95s" keyTimes="0;0.19;1" values="0.95;0;0"/>
    </circle>
    <!-- col E: 2.45s -->
    <circle cx="530" cy="115" r="0" opacity="0">
      <animate attributeName="r" dur="4.2s" repeatCount="indefinite" begin="2.45s" keyTimes="0;0.19;1" values="6;30;30"/>
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" begin="2.45s" keyTimes="0;0.19;1" values="0.95;0;0"/>
    </circle>
    <circle cx="530" cy="190" r="0" opacity="0">
      <animate attributeName="r" dur="4.2s" repeatCount="indefinite" begin="2.45s" keyTimes="0;0.19;1" values="6;30;30"/>
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" begin="2.45s" keyTimes="0;0.19;1" values="0.95;0;0"/>
    </circle>
    <circle cx="530" cy="265" r="0" opacity="0">
      <animate attributeName="r" dur="4.2s" repeatCount="indefinite" begin="2.45s" keyTimes="0;0.19;1" values="6;30;30"/>
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" begin="2.45s" keyTimes="0;0.19;1" values="0.95;0;0"/>
    </circle>
    <!-- col F: 2.95s -->
    <circle cx="630" cy="115" r="0" opacity="0">
      <animate attributeName="r" dur="4.2s" repeatCount="indefinite" begin="2.95s" keyTimes="0;0.19;1" values="6;30;30"/>
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" begin="2.95s" keyTimes="0;0.19;1" values="0.95;0;0"/>
    </circle>
    <circle cx="630" cy="190" r="0" opacity="0">
      <animate attributeName="r" dur="4.2s" repeatCount="indefinite" begin="2.95s" keyTimes="0;0.19;1" values="6;30;30"/>
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" begin="2.95s" keyTimes="0;0.19;1" values="0.95;0;0"/>
    </circle>
    <circle cx="630" cy="265" r="0" opacity="0">
      <animate attributeName="r" dur="4.2s" repeatCount="indefinite" begin="2.95s" keyTimes="0;0.19;1" values="6;30;30"/>
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" begin="2.95s" keyTimes="0;0.19;1" values="0.95;0;0"/>
    </circle>
  </g>

  <!-- distance / delay axis -->
  <line x1="180" y1="312" x2="700" y2="312" stroke="#2e2320"/>
  <g font-size="10" text-anchor="middle" fill="#a8977e">
    <text x="230" y="330">15 m</text><text x="230" y="344" fill="#7fc9a2">+59 ms</text>
    <text x="330" y="330">30 m</text><text x="330" y="344" fill="#7fc9a2">+103 ms</text>
    <text x="430" y="330">45 m</text><text x="430" y="344" fill="#7fc9a2">+146 ms</text>
    <text x="530" y="330">60 m</text><text x="530" y="344" fill="#7fc9a2">+190 ms</text>
    <text x="630" y="330">80 m</text><text x="630" y="344" fill="#7fc9a2">+248 ms</text>
  </g>

  <!-- legend -->
  <g font-size="10">
    <path d="M 30 372 A 26 26 0 0 1 46 388" fill="none" stroke="#d4af37" stroke-width="2"/>
    <text x="56" y="384" fill="#a8977e">ステージ音の波面 (343 m/s)</text>
    <circle cx="268" cy="380" r="7" fill="none" stroke="#7fc9a2" stroke-width="2"/>
    <text x="284" y="384" fill="#a8977e">ノード発音 — 波面と同時に鳴るので、音像はステージのまま音圧は目の前から</text>
  </g>
</svg>
