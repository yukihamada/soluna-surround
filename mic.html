<!doctype html>
<!-- SOLUNA mic — koe-claude のリアルタイム送話ページ (iPhone/Mac/何でも)
     送話: マイク → SL2 push (ch=koe) → Mac の koe-soluna-bridge → 声コマンド
     受話: ch=koe-reply を listen → Claude の返答(本人声)がこの端末でも鳴る
     URL: /mic?token=XXXX  (koe* チャンネルはトークン必須)
     注意: iOS Safari のマイクは HTTPS か localhost のみ。LAN の http では
     トンネル経由の https URL を使う。 -->
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOLUNA mic — koe-claude</title>
<link rel="stylesheet" href="/ui/soluna.css">
<style>
  /* page: one orb. Tap = talk. Everything else whispers. */
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:24px 18px}
  .brandrow{display:flex;flex-direction:column;align-items:center;gap:8px}
  .brandrow .title{font-family:var(--serif);font-size:1.25rem;color:var(--txt)}
  #setup{flex-direction:column;align-items:center}
  #setup .box{display:flex;flex-direction:column;gap:10px;width:min(300px,86vw)}
  #setup .s-btn{flex-direction:column;gap:2px}
  #orb{width:168px;height:168px;border-radius:50%;border:1px solid rgba(212,175,55,.35);cursor:pointer;color:var(--txt);font-size:52px;
       background:radial-gradient(circle at 35% 35%,#2b2118,#120b0e);box-shadow:0 0 44px rgba(212,175,55,.18), inset 0 1px 0 rgba(255,255,255,.08);
       transition:box-shadow .2s,transform .1s,background .3s}
  #orb.on{background:radial-gradient(circle at 35% 35%,#e2c464,#8a6b14);color:#1a1206;box-shadow:0 0 70px rgba(212,175,55,.55)}
  @media (prefers-reduced-motion:no-preference){ #orb.on{animation:pulse 1.6s ease-in-out infinite} @keyframes pulse{50%{box-shadow:0 0 96px rgba(212,175,55,.75)}} }
  #orb:active{transform:scale(.96)}
  #st{font-size:.95rem;color:var(--txt);min-height:2.6em;white-space:pre-line;line-height:1.6;max-width:26rem}
  #lvl{width:240px;height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
  #lvlbar{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
  .tag{font-size:.72rem;color:var(--dim);font-family:var(--mono)}
  .tag a{color:var(--mute)}
</style></head><body>
<div class="brandrow">
  <div class="s-brand"><span class="mark"></span>SOLUNA · MIC <small>koe-claude</small></div>
  <div class="title">タップして、話すだけ。<span class="dim small" style="display:block;font-family:var(--sans)">Tap the orb, then talk.</span></div>
</div>
<div id="setup" style="display:none;">
  <div class="box">
    <input class="s-input" id="inId" placeholder="なまえ / ID (例: kenny)" autocapitalize="off">
    <input class="s-input" id="inTok" placeholder="アクセスキー (招待リンクなら不要)" autocapitalize="off">
    <button class="s-btn primary" id="go">はじめる<small>start — allows the microphone</small></button>
  </div>
</div>
<button id="orb" style="display:none;" aria-label="talk">🎙</button>
<div id="lvl" style="display:none;"><div id="lvlbar"></div></div>
<div id="st">読み込み中…</div>
<div class="tag" id="tg"></div>
<div class="tag"><a id="logout" href="#" style="display:none;">ログアウト(ID/キーを消す)</a></div>
<script>
const q = new URLSearchParams(location.search);
// 招待リンク(?token=)で開いたらキーを保存 → 以後は素のURLでもログイン済み
if (q.get("token")) localStorage.setItem("koeTok", q.get("token"));
if (q.get("id")) localStorage.setItem("koeId", q.get("id"));
let TOKEN = localStorage.getItem("koeTok") || "";
let MYID = localStorage.getItem("koeId") || "";
const WSBASE = (location.protocol === "https:" ? "wss://" : "ws://") + location.host;
const st = t => document.getElementById("st").textContent = t;
const orb = document.getElementById("orb");
const lvlbar = document.getElementById("lvlbar");
const $ = id => document.getElementById(id);
let ctx = null, running = false, seq = 0, pushWs = null, replyWs = null, playhead = 0;

function ui() {
  const ready = TOKEN && MYID;
  $("setup").style.display = ready ? "none" : "flex";
  orb.style.display = ready ? "" : "none";
  $("lvl").style.display = ready ? "" : "none";
  $("logout").style.display = ready ? "" : "none";
  if (ready) {
    st(`${MYID} でログイン中 — タップで送話開始`);
  } else {
    st("はじめまして。なまえを入れてください");
    $("inTok").style.display = TOKEN ? "none" : "";
    if (MYID) $("inId").value = MYID;
  }
}
$("go").onclick = () => {
  const id = $("inId").value.trim();
  const tok = TOKEN || $("inTok").value.trim();
  if (!id) { st("なまえ / ID を入れてください"); return; }
  if (!tok) { st("アクセスキーが必要です(招待リンクで開くか入力)"); return; }
  MYID = id; TOKEN = tok;
  localStorage.setItem("koeId", id); localStorage.setItem("koeTok", tok);
  ui(); start();                       // タップ起点なのでマイク許可もこの流れで出る
};
$("logout").onclick = e => {
  e.preventDefault(); stop();
  localStorage.removeItem("koeId"); localStorage.removeItem("koeTok");
  MYID = ""; TOKEN = ""; ui();
};

function sl2(pcm16) {                       // 22byteヘッダ + int16 PCM (mono)
  const buf = new ArrayBuffer(22 + pcm16.length * 2);
  const dv = new DataView(buf);
  dv.setUint8(0, 0x53); dv.setUint8(1, 0x4c); dv.setUint8(2, 0x32); // "SL2"
  dv.setUint8(3, 2); dv.setUint8(4, 1); dv.setUint8(5, 0);          // ver,nchan,pad
  dv.setUint32(6, seq++ >>> 0, true);
  dv.setUint32(10, pcm16.length, true);
  dv.setFloat64(14, 0, true);                                        // playAt(server埋め)
  new Int16Array(buf, 22).set(pcm16);
  return buf;
}

async function start() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true }, video: false });
  } catch (e) {
    st("マイクが使えません: " + e.name +
       (location.protocol === "http:" ? "\n(iPhoneはhttpsのURLで開いてください)" : ""));
    return;
  }
  // 送話WS (node=IDで誰の声か分かるように)
  pushWs = new WebSocket(`${WSBASE}/audio?role=push&ch=koe&token=${TOKEN}&node=${encodeURIComponent(MYID)}`);
  pushWs.binaryType = "arraybuffer";
  pushWs.onopen = () => {
    pushWs.send(JSON.stringify({ t: "hello", map: ["L"], sr: ctx.sampleRate }));
    st(`🎙 ${MYID} 送話中 — 「クロード、〜」で話しかけて`);
    document.getElementById("tg").textContent =
      `sr=${ctx.sampleRate} → Mac (ch=koe)`;
  };
  pushWs.onclose = () => { if (running) st("接続が切れました。再タップで再開"); stop(); };
  const src = ctx.createMediaStreamSource(stream);
  const proc = ctx.createScriptProcessor(2048, 1, 1);
  src.connect(proc); proc.connect(ctx.destination);
  proc.onaudioprocess = e => {
    if (!running || !pushWs || pushWs.readyState !== 1) return;
    const f32 = e.inputBuffer.getChannelData(0);
    let peak = 0;
    const i16 = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
      const v = Math.max(-1, Math.min(1, f32[i]));
      i16[i] = v * 32767; peak = Math.max(peak, Math.abs(v));
    }
    lvlbar.style.width = Math.min(100, peak * 140) + "%";
    pushWs.send(sl2(i16));
  };
  // 受話WS: Claudeの返答(本人声)がこの端末でも鳴る
  replyWs = new WebSocket(`${WSBASE}/audio?role=listen&ch=koe-reply&pos=C&token=${TOKEN}`);
  replyWs.binaryType = "arraybuffer";
  replyWs.onmessage = ev => {
    if (typeof ev.data === "string") return;
    const dv = new DataView(ev.data);
    const nsamp = dv.getUint32(10, true);
    const i16 = new Int16Array(ev.data, 22, nsamp);
    const f32 = new Float32Array(nsamp);
    for (let i = 0; i < nsamp; i++) f32[i] = i16[i] / 32768;
    const buf = ctx.createBuffer(1, nsamp, 48000);
    buf.copyToChannel(f32, 0);
    const s = ctx.createBufferSource();
    s.buffer = buf; s.connect(ctx.destination);
    const t = Math.max(ctx.currentTime + 0.08, playhead);
    s.start(t); playhead = t + buf.duration;
  };
  running = true;
  orb.classList.add("on");
  window._cleanup = () => { stream.getTracks().forEach(t => t.stop()); proc.disconnect(); src.disconnect(); };
}

function stop() {
  running = false; orb.classList.remove("on"); lvlbar.style.width = "0%";
  if (window._cleanup) { window._cleanup(); window._cleanup = null; }
  if (pushWs) { try { pushWs.close(); } catch (e) {} pushWs = null; }
  if (replyWs) { try { replyWs.close(); } catch (e) {} replyWs = null; }
  st("停止中 — タップで送話開始");
}

orb.onclick = () => running ? stop() : start();
ui();
</script></body></html>
