app = "soluna-sound"
primary_region = "lax"

[build]

[env]
  # 音源とstate.jsonは volume(/data) へ → 再デプロイで曲もサウンドチェックも消えない
  SOLUNA_DATA_DIR = "/data"
  # QR・案内ページ(/guide /flags /api/qr)に載せる公開ドメイン。
  # 未設定だと request.host(fly.dev)になり、会場で配るQRが別ドメインを指す。
  SOLUNA_PUBLIC_BASE = "https://sound.solun.art"

[[mounts]]
  source = "soluna_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # 1万台のWSを受ける: 既定(数百)のままだとプロキシが接続を弾く
  [http_service.concurrency]
    type = "connections"
    soft_limit = 12000
    hard_limit = 20000

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
