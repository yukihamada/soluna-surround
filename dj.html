<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOLUNA DJ</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root{--ink:#0a0507;--panel:#161014;--line:#2c2320;--txt:#f2e7d3;--dim:#9d8d76;
        --gold:#d4af37;--gold2:#f0d47a;--ok:#4ade80;--bad:#f87171;
        --sans:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
        --mono:"IBM Plex Mono",ui-monospace,monospace}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--ink);color:var(--txt);font-family:var(--sans);
       font-size:15px;max-width:520px;margin:0 auto;padding:20px 18px 80px;
       transition:background .6s}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
       background:radial-gradient(60% 40% at 50% -8%, rgba(212,175,55,.13), transparent 70%);
       transition:background .6s}
  body.onair-bg::before{
       background:radial-gradient(60% 40% at 50% -8%, rgba(248,113,113,.14), transparent 70%)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  h1{font-size:.75rem;letter-spacing:.4em;color:var(--gold);font-weight:700;text-align:center;
     margin:14px 0 4px;font-family:var(--mono);text-indent:.4em}
  .sub{text-align:center;font-size:.72rem;color:var(--dim);margin-bottom:18px;letter-spacing:.06em}
  section{background:linear-gradient(180deg, rgba(255,255,255,.015), transparent 40%), var(--panel);
     border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px;
     box-shadow:0 8px 30px rgba(0,0,0,.35)}
  h2{font-size:.62rem;letter-spacing:.26em;color:var(--gold);font-weight:700;margin-bottom:14px;
     font-family:var(--mono)}
  label{font-size:.62rem;letter-spacing:.1em;color:var(--dim);display:block;margin-bottom:5px}
  input,select{width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--line);
     background:var(--ink);color:var(--txt);font-size:.95rem;font-family:var(--sans);
     transition:border-color .2s}
  input:focus,select:focus{outline:none;border-color:rgba(212,175,55,.55)}
  .row{display:flex;gap:10px}.row>div{flex:1}
  .row.mt{margin-top:12px}
  button{border:none;border-radius:13px;padding:14px;font-weight:700;cursor:pointer;
     font-size:.9rem;background:#221a16;color:var(--txt);border:1px solid var(--line);width:100%;
     font-family:var(--sans);letter-spacing:.04em;transition:transform .12s ease}
  button:active{transform:scale(.975)}
  .gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ink);border:none;
     box-shadow:0 5px 24px rgba(212,175,55,.3), inset 0 1px 0 rgba(255,255,255,.35)}
  .red{background:rgba(248,113,113,.13);color:var(--bad);border:1px solid rgba(248,113,113,.3)}
  .onair{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 14px}
  .onair .dot{width:12px;height:12px;border-radius:50%;background:#3d3531;transition:background .3s}
  .onair.live .dot{background:var(--bad);box-shadow:0 0 16px var(--bad)}
  @media (prefers-reduced-motion:no-preference){
    .onair.live .dot{animation:bl 1.2s infinite}
    @keyframes bl{50%{opacity:.35}}
  }
  .onair b{font-size:1.1rem;letter-spacing:.26em;font-family:var(--mono);text-indent:.26em}
  .onair.live b{color:var(--bad);text-shadow:0 0 22px rgba(248,113,113,.5)}
  #meter{height:12px;border-radius:6px;background:var(--ink);border:1px solid var(--line);
     overflow:hidden;margin-top:14px}
  #meterBar{height:100%;width:0%;border-radius:6px;
     background:linear-gradient(90deg,var(--ok) 60%,var(--gold) 82%,var(--bad));
     transition:width .06s linear}
  .stat{display:flex;justify-content:space-between;font-size:.72rem;color:var(--dim);margin-top:12px;
     font-family:var(--mono)}
  .stat b{color:var(--txt)}
  .seg{display:flex;gap:0;margin-bottom:14px;border:1px solid var(--line);border-radius:13px;
     overflow:hidden;background:var(--ink)}
  .seg button{flex:1;padding:12px;font-size:.84rem;border:none;border-radius:0;background:none}
  .seg button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ink);
     font-weight:700}
  .hint{font-size:.68rem;color:var(--dim);line-height:1.8;margin-top:12px}
  .check{display:flex;align-items:center;gap:10px;font-size:.8rem;margin-top:14px;color:var(--txt)}
  .check input{width:18px;height:18px;accent-color:var(--gold)}
</style>
</head>
<body>
  <h1>S O L U N A · D J</h1>
  <div class="sub">この端末が、会場全体の音源になる</div>

  <div class="onair" id="onair"><span class="dot"></span><b id="onairTxt">OFF AIR</b></div>

  <section>
    <h2>SOURCE</h2>
    <div class="seg">
      <button id="segMic" class="on">🎙 マイク / ライン</button>
      <button id="segFile">🎵 ファイル</button>
    </div>
    <div id="fileRow" style="display:none;margin-bottom:12px">
      <label>音源ファイル(この端末内)</label>
      <input type="file" id="file" accept="audio/*">
    </div>
    <div id="micRow" style="margin-bottom:12px">
      <label>入力デバイス(Mac: DJミキサーのUSB-IF等を選択)</label>
      <select id="inputDev"><option value="">既定の入力</option></select>
    </div>
    <div class="row">
      <div><label>SERVER</label><input id="server" placeholder="空欄 = このホストに配信"></div>
    </div>
    <div class="row mt">
      <div><label>CHANNEL</label><input id="ch" value="festival"></div>
      <div><label>TOKEN(本番サーバでは必須)</label><input id="tok" type="password" placeholder="主催者から受け取る"></div>
    </div>
    <label class="check"><input type="checkbox" id="fusion">
      既存PAと融合(有線/低遅延 lead 0.08s) — 単体運用はOFFのまま</label>
    <button class="gold" id="go" style="margin-top:14px">▶ ON AIR — 配信をはじめる</button>
    <button class="red" id="stopBtn" style="margin-top:8px;display:none">■ OFF AIR</button>
    <div id="meter"><div id="meterBar"></div></div>
    <div class="stat"><span>LISTENERS <b id="n" class="mono">0</b></span>
      <span>送信 <b id="sent" class="mono">0</b>f</span>
      <span>sr <b id="sr" class="mono">—</b></span></div>
    <div class="hint">マイク入力はエコー/ノイズ処理を切った音楽向け設定。DJミキサーのREC OUTを
      イヤホン端子やUSB-IFでこの端末に入れれば、そのままフロア全体へ。聴く側は同じホストの
      <span class="mono">/?zone=A</span> を開く。</div>
  </section>

  <div id="err" style="color:var(--bad);font-size:.78rem;margin-top:10px;text-align:center"></div>

<script>
const $=id=>document.getElementById(id);
let ctx=null, ws=null, running=false, seq=0, srcNode=null, procNode=null, mediaEl=null, stream=null, wakeLock=null;
$('server').value = localStorage.getItem('dj_server')||'';
$('ch').value = localStorage.getItem('dj_ch')||'festival';
// 招待リンク(/dj?token=…)で開いたらトークンを保存 → 以後は素のURLでもOK
const qtok = new URLSearchParams(location.search).get('token');
if (qtok){ localStorage.setItem('dj_tok', qtok);
  history.replaceState(null,'',location.pathname); }   // URLからは消す
$('tok').value = localStorage.getItem('dj_tok')||'';

let mode='mic';
$('segMic').onclick=()=>{mode='mic';$('segMic').classList.add('on');$('segFile').classList.remove('on');$('fileRow').style.display='none';$('micRow').style.display='';};
$('segFile').onclick=()=>{mode='file';$('segFile').classList.add('on');$('segMic').classList.remove('on');$('fileRow').style.display='';$('micRow').style.display='none';};

// 入力デバイス一覧(許可後にラベルが出る。選択は保存)
async function refreshInputs(){
  try{
    const devs = await navigator.mediaDevices.enumerateDevices();
    const sel = $('inputDev'), saved = localStorage.getItem('dj_input')||'';
    sel.innerHTML = '<option value="">既定の入力</option>';
    for (const d of devs.filter(d=>d.kind==='audioinput')){
      const o = document.createElement('option');
      o.value = d.deviceId;
      o.textContent = d.label || `入力 ${sel.length}`;
      if (d.deviceId === saved) o.selected = true;
      sel.appendChild(o);
    }
  }catch(e){}
}
refreshInputs();
navigator.mediaDevices && (navigator.mediaDevices.ondevicechange = refreshInputs);
$('inputDev').onchange = ()=> localStorage.setItem('dj_input', $('inputDev').value);

function sl2(pcm16){
  const buf=new ArrayBuffer(22+pcm16.length*2), dv=new DataView(buf);
  dv.setUint8(0,0x53);dv.setUint8(1,0x4c);dv.setUint8(2,0x32);
  dv.setUint8(3,2);dv.setUint8(4,1);dv.setUint8(5,0);
  dv.setUint32(6,seq++>>>0,true); dv.setUint32(10,pcm16.length,true);
  dv.setFloat64(14,0,true);
  new Int16Array(buf,22).set(pcm16);
  return buf;
}
function setLive(on){
  running=on;
  $('onair').classList.toggle('live',on);
  document.body.classList.toggle('onair-bg',on);
  $('onairTxt').textContent=on?'ON AIR':'OFF AIR';
  $('go').style.display=on?'none':'';
  $('stopBtn').style.display=on?'':'none';
}
async function start(){
  $('err').textContent='';
  localStorage.setItem('dj_server',$('server').value);
  localStorage.setItem('dj_ch',$('ch').value);
  localStorage.setItem('dj_tok',$('tok').value);
  try{
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    await ctx.resume();
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch(e){}
    if (mode==='mic'){
      const audio = {echoCancellation:false, noiseSuppression:false, autoGainControl:false};
      const dev = $('inputDev').value;
      if (dev) audio.deviceId = {exact: dev};
      stream = await navigator.mediaDevices.getUserMedia({audio, video:false});
      srcNode = ctx.createMediaStreamSource(stream);
      refreshInputs();                       // 許可後はデバイス名ラベルが取れる
    } else {
      const f = $('file').files[0];
      if (!f){ $('err').textContent='ファイルを選んでください'; return; }
      mediaEl = new Audio(URL.createObjectURL(f));
      mediaEl.loop = false;
      srcNode = ctx.createMediaElementSource(mediaEl);
      await mediaEl.play();
    }
    const base = $('server').value.trim() ||
      ((location.protocol==='https:'?'wss://':'ws://')+location.host);
    const tok = $('tok').value ? `&token=${encodeURIComponent($('tok').value)}` : '';
    ws = new WebSocket(`${base}/audio?role=push&ch=${encodeURIComponent($('ch').value)}${tok}&node=dj`);
    ws.binaryType='arraybuffer';
    let opened = false;
    ws.onopen = ()=>{
      opened = true;
      const lead = $('fusion').checked ? 0.08 : 0.6;
      ws.send(JSON.stringify({t:'hello',map:['L'],sr:ctx.sampleRate,lead}));
      $('sr').textContent = ctx.sampleRate;
      setLive(true);
    };
    ws.onclose = ()=>{
      if (!opened){    // 一度も開けず即クローズ=ほぼ認証拒否(403)。リトライしない
        stop();
        $('err').textContent = 'このサーバは配信トークンが必要です。TOKEN欄に入力して(主催者から受け取る)、もう一度 ON AIR を押してください。';
        return;
      }
      if(running){ $('err').textContent='接続が切れました — 再接続します';
        setTimeout(()=>{ if(running) reconnect(); }, 1500);}
    };
    // 取り込み: AudioWorklet(別スレッド=メインスレッドの重さで音を落とさない)。
    // 非対応ブラウザは ScriptProcessor にフォールバック。~2048サンプルに束ねて送信。
    let sent=0, acc=new Float32Array(0);
    const CHUNK = 2048;
    function sendChunk(f32){
      let peak=0;
      const i16=new Int16Array(f32.length);
      for(let i=0;i<f32.length;i++){
        const v=Math.max(-1,Math.min(1,f32[i]));
        i16[i]=v*32767; peak=Math.max(peak,Math.abs(v));
      }
      $('meterBar').style.width=Math.min(100,peak*130)+'%';
      ws.send(sl2(i16));
      $('sent').textContent=++sent;
    }
    function pushBlock(f32){
      if (!running || !ws || ws.readyState!==1) return;
      const merged=new Float32Array(acc.length+f32.length);
      merged.set(acc); merged.set(f32, acc.length); acc=merged;
      while (acc.length >= CHUNK){
        sendChunk(acc.subarray(0, CHUNK));
        acc = acc.slice(CHUNK);
      }
    }
    if (ctx.audioWorklet){
      const wsrc = `class Cap extends AudioWorkletProcessor{
        process(inputs){ const c=inputs[0][0]; if(c) this.port.postMessage(c.slice(0)); return true; } }
        registerProcessor('soluna-cap', Cap);`;
      await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([wsrc],{type:'application/javascript'})));
      procNode = new AudioWorkletNode(ctx, 'soluna-cap');
      procNode.port.onmessage = e=> pushBlock(e.data);
    } else {
      procNode = ctx.createScriptProcessor(2048,1,1);
      procNode.onaudioprocess = e=> pushBlock(new Float32Array(e.inputBuffer.getChannelData(0)));
    }
    srcNode.connect(procNode);
    const mute = ctx.createGain(); mute.gain.value = 0;   // マイク回り込み防止
    procNode.connect(mute); mute.connect(ctx.destination);
    if (mode==='file') srcNode.connect(ctx.destination);  // ファイルは手元モニターも鳴らす
  }catch(e){
    $('err').textContent='開始できません: '+(e.name||e);
    stop();
  }
}
function reconnect(){ stopAudioKeep(); start(); }
function stopAudioKeep(){ try{ws&&ws.close()}catch(e){} ws=null; }
function stop(){
  setLive(false);
  try{ wakeLock?.release(); }catch(e){} wakeLock=null;
  try{ws&&ws.close()}catch(e){} ws=null;
  try{procNode&&procNode.disconnect()}catch(e){}
  try{srcNode&&srcNode.disconnect()}catch(e){}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  if(mediaEl){try{mediaEl.pause()}catch(e){} mediaEl=null;}
  if(ctx){try{ctx.close()}catch(e){} ctx=null;}
  $('meterBar').style.width='0%';
}
$('go').onclick=start;
$('stopBtn').onclick=stop;
document.addEventListener('visibilitychange', ()=>{   // 画面復帰時にaudio/wakeLock回復
  if (!document.hidden && running && ctx){ ctx.resume();
    navigator.wakeLock?.request('screen').then(w=>wakeLock=w).catch(()=>{}); }
});
setInterval(async ()=>{
  try{
    const base = $('server').value.trim().replace(/^wss/,'https').replace(/^ws(?!s)/,'http') || '';
    const s = await (await fetch(`${base}/status`)).json();
    const c = s.channels[$('ch').value];
    $('n').textContent = c ? c.listeners : 0;
  }catch(e){}
},2500);
</script>
</body>
</html>
