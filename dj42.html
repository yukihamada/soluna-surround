<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>DJ42 · SOLUNA SOUND</title>
<link rel="stylesheet" href="/ui/soluna.css">
<style>
  :root{--gold:#d4af37;--bg:#0a0a0c;--panel:#141418;--line:#2a2a30;--dim:#8a8a92;--ink:#eee}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Helvetica Neue",Arial,"Hiragino Sans",sans-serif;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  /* ---- キー画面 ---- */
  #gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:18px;background:radial-gradient(120% 90% at 50% 0%,#1a1420 0%,#0a0a0c 60%);padding:24px;text-align:center}
  #gate h1{font-size:26px;margin:0;letter-spacing:2px}
  #gate h1 span{background:linear-gradient(90deg,#ff3d6e,#ff8a3d,#ffcf5c);-webkit-background-clip:text;color:transparent}
  #gate p{color:var(--dim);font-size:13px;margin:0;max-width:320px}
  #keyRow{display:flex;gap:8px;width:100%;max-width:340px}
  #key{flex:1;min-height:52px;font-size:18px;letter-spacing:3px;text-align:center;text-transform:lowercase;
       background:#1c1c22;border:1px solid var(--line);border-radius:14px;color:#fff;padding:0 14px}
  #key:focus{outline:none;border-color:var(--gold)}
  #go{min-height:52px;padding:0 22px;border:none;border-radius:14px;font-weight:800;font-size:16px;
      background:linear-gradient(90deg,#ff3d6e,#ffcf5c);color:#1a1206;cursor:pointer}
  #gateErr{color:#ff8a8a;font-size:13px;min-height:18px}
  .lock{font-size:34px}
  /* ---- リモコン ---- */
  #app{display:none;padding-bottom:40px}
  header{padding:18px 18px 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  header h1{font-size:19px;margin:0;letter-spacing:1px}
  header h1 span{background:linear-gradient(90deg,#ff3d6e,#ff8a3d,#ffcf5c);-webkit-background-clip:text;color:transparent}
  header .sub{color:var(--dim);font-size:12px}
  .live{margin:6px 14px 14px;display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);
        border-radius:14px;background:var(--panel)}
  .dot{width:10px;height:10px;border-radius:50%;background:#555;flex:0 0 auto}
  .dot.on{background:#3ddc84;box-shadow:0 0 10px #3ddc84}
  .live b{font-size:15px}
  .live span{color:var(--dim);font-size:12px;margin-left:auto}
  .list{padding:0 12px}
  .track{display:flex;align-items:center;gap:12px;padding:14px 12px;border:1px solid var(--line);border-radius:14px;
         background:var(--panel);margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s}
  .track:active{transform:scale(.99)}
  .track.on{border-color:var(--gold);background:#1e1a10}
  .track .no{width:26px;text-align:center;color:var(--dim);font-size:14px;font-weight:700}
  .track.on .no{color:var(--gold)}
  .track .t{flex:1;min-width:0}
  .track .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track .t span{font-size:12px;color:var(--dim)}
  .track .dur{font-size:12px;color:var(--dim)}
  .track .go{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
             font-size:14px;background:linear-gradient(90deg,#ff3d6e,#ffcf5c);color:#1a1206}
  #stopRow{padding:4px 12px 0}
  #stop{width:100%;min-height:52px;border:1px solid #7a2a2a;border-radius:14px;background:#2a1414;color:#ff8a8a;
        font-size:16px;font-weight:700;cursor:pointer}
  .warn{margin:12px 14px 0;padding:9px 12px;border:1px solid #6a4a1a;background:#2a1f0a;border-radius:10px;font-size:11.5px;color:#f0c75a}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;
         background:#1e1a10;border:1px solid var(--gold);color:#f5e6b8;padding:10px 18px;border-radius:999px;font-size:13px;
         pointer-events:none;z-index:60;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="gate">
  <div class="lock">🔒</div>
  <h1>SOLUNA <span>SOUND</span> · DJ42</h1>
  <p>合言葉を入れると、6曲を会場の全端末へ配信できます（音も光も一緒に飛びます）。</p>
  <div id="keyRow">
    <input id="key" type="password" inputmode="text" autocomplete="off" placeholder="キー" aria-label="キー">
    <button id="go">開く</button>
  </div>
  <div id="gateErr"></div>
</div>

<div id="app">
  <header>
    <h1>SOLUNA <span>SOUND</span> · DJ42</h1>
    <span class="sub">タップ = 全端末へ配信</span>
  </header>

  <div class="live">
    <span class="dot" id="dot"></span>
    <b id="liveTxt">接続中…</b>
    <span id="nListeners"></span>
  </div>

  <div class="list" id="list"></div>

  <div id="stopRow">
    <button id="stop">■ 停止（音も光も消す）</button>
  </div>

  <div class="warn">⚠ 音源の権利確認は未了。外部公開・配布は別承認。</div>
</div>

<div id="toast"></div>

<script>
const KEY = 'dj42';
const $ = id => document.getElementById(id);
let tracks = [], idx = -1, liveTimer = null;

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1600);
}

function unlock(){
  $('gate').style.display = 'none';
  $('app').style.display = 'block';
  load();
  pollLive(); liveTimer = setInterval(pollLive, 4000);
}
$('go').onclick = ()=>{
  const v = ($('key').value || '').trim().toLowerCase();
  if (v === KEY){ try{ localStorage.setItem('dj42_ok','1'); }catch(e){} unlock(); }
  else { $('gateErr').textContent = 'キーが違います'; $('key').value=''; }
};
$('key').addEventListener('keydown', e=>{ if (e.key==='Enter') $('go').click(); });
try{ if (localStorage.getItem('dj42_ok')==='1') unlock(); }catch(e){}

// ---- セットリスト取得 ----
async function load(){
  try{
    const d = await (await fetch('/api/show?ch=festival')).json();
    tracks = (d.show && d.show.steps) || d.steps || [];
  }catch(e){ tracks = []; }
  const list = $('list');
  if (!tracks.length){ list.innerHTML = '<p style="color:#888;padding:0 6px">セットリストが未投入です。</p>'; return; }
  list.innerHTML = '';
  tracks.forEach((s,i)=>{
    const el = document.createElement('div');
    el.className = 'track'; el.dataset.i = i;
    el.innerHTML = `<div class="no">${i+1}</div>
      <div class="t"><b>${s.label}</b><span>音 + 光 + 映像</span></div>
      <div class="dur">${fmt(s.dur)}</div>
      <div class="go">▶</div>`;
    el.onclick = ()=> fire(i);
    list.appendChild(el);
  });
  // 現在の再生位置を反映
  pollLive();
}
function fmt(s){ s = Math.max(0, Math.floor(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

function mark(i){
  idx = i;
  document.querySelectorAll('.track').forEach(el=>el.classList.toggle('on', Number(el.dataset.i)===i));
}

// ---- 配信 ----
async function fire(i){
  mark(i);
  toast(`「${tracks[i] ? tracks[i].label : i+1}」を全端末へ配信`);
  try{
    const r = await fetch('/api/dj42', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({key: KEY, action:'play', i})
    });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (d.listeners !== undefined) $('nListeners').textContent = `参加 ${d.listeners} 台`;
  }catch(e){ toast('配信に失敗: ' + e); }
  pollLive();
}
$('stop').onclick = async ()=>{
  mark(-1);
  try{
    await fetch('/api/dj42', {method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({key: KEY, action:'stop'})});
  }catch(e){}
  toast('停止しました');
  pollLive();
};

// ---- ライブ状態 ----
async function pollLive(){
  try{
    const s = await (await fetch('/status')).json();
    const c = (s.channels && s.channels.festival) || {};
    const n = c.listeners || 0;
    $('nListeners').textContent = `参加 ${n} 台`;
    const playing = !!c.cue;
    $('dot').classList.toggle('on', playing);
    $('liveTxt').textContent = playing ? '配信中' : (n ? '待機中' : '参加者なし');
    // サーバ側の現在位置を反映
    const i = (c.show && c.show.i) ? c.show.i - 1 : -1;
    if (i >= 0 && i !== idx) mark(i);
    if (!playing && idx >= 0 && !c.cue) { /* keep mark */ }
  }catch(e){}
}
</script>
</body>
</html>
