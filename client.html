<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOLUNA Surround</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#0a0507;color:#f4e8d0;font-family:system-ui,-apple-system,sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;
       justify-content:center;padding:24px;text-align:center;gap:18px}
  h1{font-size:.8rem;letter-spacing:.35em;color:#d4af37;font-weight:800}
  .pos{font-size:6rem;font-weight:900;line-height:1;
       background:linear-gradient(135deg,#d4af37,#f5d16b);-webkit-background-clip:text;
       -webkit-text-fill-color:transparent}
  .poslabel{font-size:.7rem;letter-spacing:.2em;color:rgba(244,232,208,.5)}
  .picker{display:flex;gap:10px}
  .picker a{display:flex;width:54px;height:54px;align-items:center;justify-content:center;
       border-radius:50%;border:1px solid rgba(212,175,55,.3);color:#d4af37;
       text-decoration:none;font-weight:800;font-size:1.1rem}
  .picker a.on{background:#d4af37;color:#0a0507;border-color:#d4af37}
  button{appearance:none;border:none;border-radius:99px;padding:18px 48px;font-size:1.1rem;
       font-weight:800;cursor:pointer;background:linear-gradient(135deg,#d4af37,#f5d16b);
       color:#0a0507;min-width:220px}
  button.stop{background:rgba(255,80,80,.25);color:#ff8a8a}
  .grid{display:grid;grid-template-columns:auto auto;gap:4px 16px;font-size:.72rem;
       color:rgba(244,232,208,.55);font-variant-numeric:tabular-nums}
  .grid b{color:#f4e8d0;font-weight:700}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:6px}
  .dot.live{background:#34d399;box-shadow:0 0 10px #34d399}
  .hint{font-size:.66rem;color:rgba(244,232,208,.35);max-width:300px;line-height:1.7}
</style>
</head>
<body>
  <h1>S O L U N A &nbsp;·&nbsp; S U R R O U N D</h1>
  <div class="poslabel">この端末のポジション</div>
  <div class="pos" id="posBig">L</div>
  <div class="picker" id="picker">
    <a href="?pos=L" data-p="L">L</a>
    <a href="?pos=C" data-p="C">C</a>
    <a href="?pos=R" data-p="R">R</a>
  </div>
  <button id="btn">▶ 再生する</button>
  <div class="grid">
    <span><span class="dot" id="dot"></span>状態</span><b id="st">停止中</b>
    <span>クロック誤差</span><b id="off">—</b>
    <span>RTT</span><b id="rtt">—</b>
    <span>受信フレーム</span><b id="fr">0</b>
    <span>遅延スキップ</span><b id="late">0</b>
    <span>ストリーム時刻</span><b id="stream">—</b>
  </div>
  <div class="hint">3台を部屋の左・中央・右に置いて、それぞれ L / C / R で再生。同じ瞬間に音が揃い、ブリップが端末間を移動します。</div>

<script>
const SR = 48000, HEADER = 22;
const qs = new URLSearchParams(location.search);
let POS = (qs.get('pos') || 'L').toUpperCase();
document.getElementById('posBig').textContent = POS;
for (const a of document.querySelectorAll('#picker a')) {
  if (a.dataset.p === POS) a.classList.add('on');
}

let ctx=null, ws=null, active=false;
let offsetMs=null, bestRtt=Infinity;          // serverEpochMs = perfNow + offsetMs
let playHead=0, frames=0, late=0, lastStreamT=0;

const $ = id => document.getElementById(id);

function setLive(on){
  $('dot').classList.toggle('live', on);
  $('st').textContent = on ? '受信中' : '停止中';
  $('btn').textContent = on ? '■ 停止' : '▶ 再生する';
  $('btn').classList.toggle('stop', on);
}

// ---- clock sync ----------------------------------------------------------
function sendPing(){
  if (ws && ws.readyState===1) ws.send(JSON.stringify({t:'ping', c:performance.now()}));
}
function onPong(m){
  const now = performance.now();
  const rtt = now - m.c;
  const serverAtRecv = m.s + rtt/2;            // ms, server epoch at this instant
  if (rtt < bestRtt || offsetMs===null){       // keep the lowest-jitter sample
    bestRtt = Math.min(bestRtt, rtt);
    offsetMs = serverAtRecv - now;             // serverEpoch = perfNow + offsetMs
  }
  $('off').textContent = offsetMs===null ? '—' : (offsetMs>=0?'+':'') + offsetMs.toFixed(1)+'ms';
  $('rtt').textContent = rtt.toFixed(1)+'ms';
}

// ---- audio ---------------------------------------------------------------
function onFrame(buf){
  if (!ctx || !active || offsetMs===null) return;
  if (buf.byteLength <= HEADER) return;
  const dv = new DataView(buf);
  // magic@0(3) ver@3 nchan@4 pad@5 seq@6 nsamp@10 playAt@14(f64 LE)
  const nsamp = dv.getUint32(10, true);
  const playAt = dv.getFloat64(14, true);      // server-epoch seconds
  const pcm = new Int16Array(buf, HEADER, nsamp);
  const f32 = new Float32Array(nsamp);
  for (let i=0;i<nsamp;i++) f32[i] = pcm[i] / 32768;
  const ab = ctx.createBuffer(1, nsamp, SR);
  ab.copyToChannel(f32, 0);
  const src = ctx.createBufferSource();
  src.buffer = ab;
  src.connect(ctx.destination);

  // map server playAt -> local performance.now() -> AudioContext time
  const playAtPerfMs = playAt*1000 - offsetMs;
  const deltaSec = (playAtPerfMs - performance.now())/1000;
  let startAt = ctx.currentTime + deltaSec;
  if (startAt < ctx.currentTime + 0.003){       // arrived too late to be in sync
    late++; $('late').textContent = late;
    return;                                      // drop, never play out of phase
  }
  src.start(startAt);
  frames++; lastStreamT = playAt;
  $('fr').textContent = frames;
}

function connect(){
  const proto = location.protocol==='https:' ? 'wss:' : 'ws:';
  const ch = qs.get('ch') || 'festival';
  ws = new WebSocket(`${proto}//${location.host}/audio?role=listen&ch=${encodeURIComponent(ch)}&pos=${POS}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = ()=>{ setLive(true); sendPing(); };
  ws.onmessage = e=>{
    if (typeof e.data === 'string'){ const m=JSON.parse(e.data); if(m.t==='pong') onPong(m); }
    else onFrame(e.data);
  };
  ws.onclose = ()=>{ setLive(false); if(active) setTimeout(connect, 800); };
  ws.onerror = ()=>{};
}

async function start(){
  ctx = new (window.AudioContext||window.webkitAudioContext)({sampleRate:SR});
  await ctx.resume();
  active = true; frames=0; late=0; bestRtt=Infinity; offsetMs=null;
  $('fr').textContent=0; $('late').textContent=0;
  connect();
}
function stop(){
  active=false; if(ws){try{ws.close()}catch(e){}} if(ctx){try{ctx.close()}catch(e){}} ctx=null;
  setLive(false);
}
$('btn').onclick = ()=> active ? stop() : start();
setInterval(sendPing, 500);
setInterval(()=>{ $('stream').textContent = active ? lastStreamT.toFixed(2)+'s' : '—'; }, 250);
</script>
</body>
</html>
