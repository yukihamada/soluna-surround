<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0507">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>SOLUNA SOUND</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#0a0507;color:#f4e8d0;font-family:system-ui,-apple-system,sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;
       justify-content:center;padding:24px;text-align:center;gap:16px}
  h1{font-size:.8rem;letter-spacing:.35em;color:#d4af37;font-weight:800}
  .zone{font-size:5rem;font-weight:900;line-height:1;
       background:linear-gradient(135deg,#d4af37,#f5d16b);-webkit-background-clip:text;
       -webkit-text-fill-color:transparent}
  .zonelabel{font-size:.7rem;letter-spacing:.2em;color:rgba(244,232,208,.5)}
  .picker{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:320px}
  .picker button{display:flex;width:46px;height:46px;align-items:center;justify-content:center;
       border-radius:50%;border:1px solid rgba(212,175,55,.3);color:#d4af37;background:none;
       font-weight:800;font-size:1rem;cursor:pointer;min-width:0;padding:0}
  .picker button.on{background:#d4af37;color:#0a0507;border-color:#d4af37}
  .main{appearance:none;border:none;border-radius:99px;padding:18px 48px;font-size:1.1rem;
       font-weight:800;cursor:pointer;background:linear-gradient(135deg,#d4af37,#f5d16b);
       color:#0a0507;min-width:230px}
  .main.stop{background:rgba(255,80,80,.25);color:#ff8a8a}
  .grid{display:grid;grid-template-columns:auto auto;gap:4px 16px;font-size:.72rem;
       color:rgba(244,232,208,.55);font-variant-numeric:tabular-nums}
  .grid b{color:#f4e8d0;font-weight:700}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:6px}
  .dot.live{background:#34d399;box-shadow:0 0 10px #34d399}
  .hint{font-size:.66rem;color:rgba(244,232,208,.35);max-width:300px;line-height:1.7}
  input[type=range]{width:200px;accent-color:#d4af37}
  .vol{display:flex;align-items:center;gap:10px;font-size:.7rem;color:rgba(244,232,208,.5)}
  /* SOLUNAモード: 全画面カラーレイヤー(音と同じクロックで色が同期) */
  #lightLayer{position:fixed;inset:0;z-index:99;display:none;background:#000;
       transition:none;touch-action:manipulation}
  #lightLayer.on{display:block}
  #lightHud{position:fixed;left:0;right:0;bottom:34px;z-index:100;display:none;
       text-align:center;pointer-events:none}
  #lightHud.show{display:block}
  #lightHud .chip{display:inline-flex;gap:14px;align-items:center;pointer-events:auto;
       background:rgba(10,5,7,.72);border:1px solid rgba(212,175,55,.35);border-radius:99px;
       padding:10px 18px;font-size:.85rem;color:#f4e8d0;backdrop-filter:blur(8px)}
  #lightHud b{color:#d4af37;font-weight:900;font-size:1.05rem}
  #lightExit{pointer-events:auto;border:none;background:rgba(255,80,80,.25);color:#ff8a8a;
       border-radius:99px;padding:8px 16px;font-weight:800;font-size:.8rem}
</style>
</head>
<body>
  <h1>S O L U N A &nbsp;·&nbsp; S O U N D</h1>
  <div class="zonelabel" data-i18n="zoneLabel">あなたのゾーン(近くの旗の色/記号)</div>
  <div class="zone" id="zoneBig">A</div>
  <div class="picker" id="picker"></div>
  <button class="main" id="btn">▶ 音に参加する</button>
  <div class="vol">🔉 <input type="range" id="vol" min="0" max="100" value="80"> 🔊</div>
  <div style="display:flex;align-items:center;gap:8px;font-size:.78rem;color:rgba(244,232,208,.6)">
    <span class="dot" id="dot"></span><b id="st" style="color:#f4e8d0">停止中</b>
  </div>
  <details style="font-size:.72rem;color:rgba(244,232,208,.45)">
    <summary style="cursor:pointer;list-style:none" data-i18n="details">詳細</summary>
    <div class="grid" style="margin-top:8px">
      <span data-i18n="zoneDelay">ゾーン遅延</span><b id="dly">—</b>
      <span data-i18n="clock">同期精度</span><b id="off">—</b>
      <span>RTT</span><b id="rtt">—</b>
      <span data-i18n="cueL">キュー</span><b id="cue">—</b>
      <span data-i18n="geoL">ステージ距離</span><b id="geo">—</b>
      <span data-i18n="liveL">ライブ受信</span><b id="fr">0</b>
    </div>
  </details>
  <div class="hint" data-i18n="hint">近くのスピーカー旗と同じゾーンを選ぶと、会場全体で位相の揃った音になります。画面はつけたままで。</div>
  <div class="hint" data-i18n="hint2">音が出ない時: iPhoneはサイレントスイッチをOFFに・音量を上げて。</div>

  <div id="lightLayer"></div>
  <div id="lightHud"><span class="chip">ZONE <b id="hudZone">A</b> <span id="hudPat"></span>
    <button id="lightFull" style="pointer-events:auto;border:none;background:rgba(212,175,55,.2);color:#d4af37;border-radius:99px;padding:8px 14px;font-weight:800;font-size:.8rem">⛶</button>
    <button id="lightExit">✕ 抜ける</button></span></div>

<script>
const SR = 48000, HEADER = 22;
const qs = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);

// ---- i18n (ja / en) ---------------------------------------------------------
const I18N = {
  ja: { zoneLabel:'あなたのゾーン(近くの旗の色/記号)', status:'状態', zoneDelay:'ゾーン遅延',
        clock:'同期精度', cueL:'キュー', liveL:'ライブ受信',
        hint:'近くのスピーカー旗と同じゾーンを選ぶと、会場全体で位相の揃った音になります。画面はつけたままで。',
        join:'▶ 音に参加する', leave:'■ 抜ける', idle:'停止中', conn:'接続中',
        ready:'準備中…', done:'終了済み', fail:'取得失敗', exit:'✕ 抜ける', details:'詳細',
        autoZone:'場所からゾーンを自動選択', geoDenied:'位置情報オフ(手動選択)', geoL:'ステージ距離',
        preloaded:'準備OK', hint2:'音が出ない時: iPhoneはサイレントスイッチをOFFに・音量を上げて。' },
  en: { zoneLabel:'YOUR ZONE (flag near you)', status:'STATUS', zoneDelay:'ZONE DELAY',
        clock:'SYNC ACCURACY', cueL:'CUE', liveL:'LIVE FRAMES',
        hint:'Pick the zone on the flag nearest to you and the whole venue plays in phase. Keep your screen on.',
        join:'▶ JOIN THE SOUND', leave:'■ LEAVE', idle:'idle', conn:'connected',
        ready:'loading…', done:'ended', fail:'fetch failed', exit:'✕ LEAVE', details:'details',
        autoZone:'auto zone from location', geoDenied:'location off (manual)', geoL:'STAGE DIST',
        preloaded:'ready', hint2:'No sound? On iPhone, flip the silent switch off and turn the volume up.' },
};
const LANG = (qs.get('lang') || navigator.language || 'ja').startsWith('ja') ? 'ja' : 'en';
const T = I18N[LANG];
document.querySelectorAll('[data-i18n]').forEach(el => {
  el.textContent = T[el.dataset.i18n] || el.textContent;
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});

let ZONE = (qs.get('zone') || qs.get('pos') || 'A').toUpperCase();
// 接続前でもQRのゾーンを選べるよう、サーバ既定と同じA–Fを初期値に持つ
// (delay_ms = 距離/343*1000 + 15ms。接続後はサーバconfigが正)
let zones = {A:15.0, B:58.7, C:102.5, D:146.2, E:189.9, F:248.2};
let baseMs = 0;                           // ハウスPA位相合わせの一括トリム(config)
const customD = qs.get('d');              // ?d=<m> 距離を直接指定(スタッフ用)

let ctx=null, ws=null, active=false, wakeLock=null;
let frames=0, lastCueId=null, srvSr=48000;   // LIVE配信元の実サンプルレート(config)
let cueSrc=null, cueGainNode=null, cueBuf=null, cueBufUrl=null, pendingCue=null;

// ---- clock sync: 直近windowの最小RTTサンプルのoffsetを採用 ------------------
const syncWin = [];                       // {rtt, off}
let offsetMs = null, pingCount = 0, pingTimer = null;
function sendPing(){
  if (ws && ws.readyState===1) ws.send(JSON.stringify({t:'ping', c:performance.now()}));
}
function onPong(m){
  const now = performance.now();
  const rtt = now - m.c;
  const off = (m.s + rtt/2) - now;        // serverEpochMs = perfNow + off
  syncWin.push({rtt, off});
  if (syncWin.length > 30) syncWin.shift();
  const best = syncWin.reduce((a,b)=> b.rtt<a.rtt ? b : a);
  offsetMs = best.off;
  pingCount++;
  if (pingCount === 10){                  // 収束後はサーバ負荷を下げる(5000台対策)
    clearInterval(pingTimer); pingTimer = setInterval(sendPing, 3000);
  }
  // 生のepochオフセットは無意味な巨大数なので、同期精度(±bestRTT/2)を見せる
  $('off').textContent = '±' + (best.rtt/2).toFixed(1)+'ms';
  $('rtt').textContent = rtt.toFixed(1)+'ms';
  if (pendingCue && cueBuf) armCue();     // 同期がとれた時点で保留キューを発火
}
const serverNowSec = () => (performance.now() + offsetMs) / 1000;

// ---- zone delay -------------------------------------------------------------
function delayMs(){
  let z;
  if (customD !== null && customD !== undefined && customD !== '')
    z = parseFloat(customD)/343*1000 + 15;              // スタッフの距離直指定
  else if (autoDist !== null)
    z = autoDist/343*1000 + 15;                          // 📍AUTO: 距離から連続計算
  else
    z = zones[ZONE] ?? 15;                               // ゾーン旗(フォールバック)
  return Math.max(0, z + baseMs);
}

// ---- GPS自動(ゾーン不要) ------------------------------------------------------
// サーバconfigのステージ座標(geo)がある場合、GPS距離から遅延を「連続値」で直接
// 計算する — ゾーン分け自体が不要になる。ゾーン旗はGPS不可時のフォールバック。
// ・精度>30mの測位は捨てる ・直近5点の中央値でスムージング
// ・3.5m(=10ms)以上動いた時だけ、最短8秒間隔で再スケジュール(音を途切れさせない)
// ・QRでゾーン指定して開いた場合は旗が正なので初期OFF(📍タップでON)
let stageGeo=null, geoWatchId=null, geoInfo='—';
let autoDist=null, geoFixes=[], lastApplyT=0;
let autoZone = !qs.get('zone') && !qs.get('pos');
function havM(a,b){
  const R=6371000, r=x=>x*Math.PI/180;
  const dLat=r(b.lat-a.lat), dLng=r(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function zoneFromDistance(d){
  let best=null, bestDiff=Infinity;
  for (const [name, ms] of Object.entries(zones)){
    const zm = Math.max(0,(ms-15))/1000*343;      // delay_ms → 距離[m] に逆算
    const diff = Math.abs(zm - d);
    if (diff < bestDiff){ bestDiff=diff; best=name; }
  }
  return best;
}
function onGeoFix(pos){
  if (!stageGeo || !autoZone) return;
  const acc = pos.coords.accuracy;
  const d = havM({lat:pos.coords.latitude, lng:pos.coords.longitude}, stageGeo);
  geoInfo = `${d.toFixed(0)}m ±${acc.toFixed(0)}m`;
  $('geo') && ($('geo').textContent = geoInfo);
  if (acc > 30) return;                            // 粗い測位で遅延を揺らさない
  geoFixes.push(d);
  if (geoFixes.length > 5) geoFixes.shift();
  const med = [...geoFixes].sort((a,b)=>a-b)[Math.floor(geoFixes.length/2)];
  const now = performance.now();
  const moved = autoDist===null || Math.abs(med - autoDist) > 3.5;   // 3.5m ≒ 10ms
  if (moved && (autoDist===null || now - lastApplyT > 8000)){
    autoDist = med; lastApplyT = now;
    const z = zoneFromDistance(med);               // FOH集計用に最寄りゾーンを報告
    if (z && z !== ZONE){ ZONE = z;
      if (ws && ws.readyState===1) ws.send(JSON.stringify({t:'zone', zone:ZONE}));
    }
    renderZones();
    if (cueBuf && lastCueId) armCue();             // 新しい遅延で曲中同期し直す
  }
}
function startGeoWatch(){
  if (!stageGeo || geoWatchId!==null || !navigator.geolocation) return;
  geoWatchId = navigator.geolocation.watchPosition(onGeoFix,
    e=>{ // 拒否(code=1)のみ手動へ。圏外/タイムアウトは一時的なので監視継続
      if (e.code === 1){ geoInfo = T.geoDenied; autoZone=false; renderZones(); }
      $('geo') && ($('geo').textContent = geoInfo);
    },
    {enableHighAccuracy:true, maximumAge:2000, timeout:15000});
}
function stopGeoWatch(){
  if (geoWatchId!==null && navigator.geolocation) navigator.geolocation.clearWatch(geoWatchId);
  geoWatchId=null;
}
function renderZones(){
  const p = $('picker'); p.innerHTML='';
  for (const z of Object.keys(zones)){
    const b = document.createElement('button');
    b.textContent = z;
    if (z===ZONE) b.classList.add('on');
    b.onclick = ()=>{ ZONE=z; autoZone=false; autoDist=null; geoFixes=[]; renderZones();   // 手動選択=自動OFF
      if (ws && ws.readyState===1) ws.send(JSON.stringify({t:'zone', zone:ZONE}));
      if (cueBuf && lastCueId) armCue();   // ゾーン変更 → 遅延を替えて即リスケジュール
    };
    p.appendChild(b);
  }
  if (stageGeo && navigator.geolocation){       // 📍 = GPSで遅延を自動計算(ゾーン不要)
    const b = document.createElement('button');
    b.textContent = '📍';
    b.title = T.autoZone;
    if (autoZone) b.classList.add('on');
    b.onclick = ()=>{ autoZone=true; renderZones(); startGeoWatch(); };
    p.appendChild(b);
  }
  $('zoneBig').textContent = customD ? customD+'m'
    : (autoZone && autoDist!==null) ? `📍${autoDist.toFixed(0)}m` : ZONE;
  $('dly').textContent = delayMs().toFixed(1)+'ms';
}

// ---- CUE MODE: 事前配布ファイルを playAt で一斉スケジュール -------------------
async function loadTrack(url){
  if (cueBufUrl === url && cueBuf) return;
  const res = await fetch(url);
  const raw = await res.arrayBuffer();
  cueBuf = await ctx.decodeAudioData(raw);
  cueBufUrl = url;
  energyEnv = null;                            // 音源が替わったら包絡も作り直す
  if (light) energyEnv = buildEnergyEnv(cueBuf);
}
async function onPreload(m){                    // 開演前DL: 再生はしない
  try{ await loadTrack(m.url); $('cue').textContent = T.preloaded; }
  catch(e){ $('cue').textContent = T.fail; }
}
async function onCue(m){
  $('cue').textContent = T.ready;
  pendingCue = m;
  await loadTrack(m.url);
  lastCueId = m.id;
  if (offsetMs !== null) armCue();
}
function armCue(){
  const m = pendingCue; if (!m || !cueBuf || !ctx) return;
  if (cueSrc){ try{cueSrc.stop()}catch(e){} cueSrc=null; }
  const src = ctx.createBufferSource();
  src.buffer = cueBuf; src.loop = !!m.loop;
  const g = ctx.createGain();
  g.gain.value = (m.gain ?? 1) * ($('vol').value/100);
  src.connect(g); g.connect(ctx.destination);
  cueGainNode = g;

  // sample0 が鳴るべきローカル実時間 = at + ゾーン遅延
  const targetSec = m.at + delayMs()/1000;
  const perfAtCtx = performance.now(), ctxNow = ctx.currentTime;
  const ctxTimeFor = perfMs => ctxNow + (perfMs - perfAtCtx)/1000;
  const targetPerfMs = targetSec*1000 - offsetMs;

  if (targetPerfMs > performance.now() + 50){
    src.start(ctxTimeFor(targetPerfMs), 0);            // これから始まる → 予約
  } else {
    const startCtx = ctxNow + 0.20;                    // 途中参加 → 曲中同期で合流
    const startPerfMs = perfAtCtx + 200;
    let intoSec = (startPerfMs + offsetMs)/1000 - targetSec;
    if (m.loop) intoSec = intoSec % cueBuf.duration;
    if (intoSec >= cueBuf.duration && !m.loop){ $('cue').textContent=T.done; return; }
    src.start(startCtx, Math.max(0, intoSec));
  }
  cueSrc = src;
  $('cue').textContent = m.id;
}
function onCueStop(){
  pendingCue=null; lastCueId=null;
  if (cueSrc){ try{cueSrc.stop()}catch(e){} cueSrc=null; }
  $('cue').textContent = '—';
}

// ---- SOLUNA MODE: 全画面カラー同期 ------------------------------------------
// 色データは受信しない。「パターン+基準時刻」から (ゾーン位置, 同期時刻) で
// 各端末がローカル計算する。音連動(audio)はデコード済みキュー音源の
// エネルギー包絡をローカル解析して明るさへ変換(追加通信ゼロ)。
let light=null, lightRAF=0, energyEnv=null, energyHop=1024;
const jitter = Math.random();                 // plasma用の端末ごとの揺らぎ
const hex2rgb = h=>{ const v=parseInt(h.replace('#',''),16);
  return [(v>>16)&255,(v>>8)&255,v&255]; };
const mix = (a,b,t)=> a.map((v,i)=> v+(b[i]-v)*t);
const scaleC = (c,k)=> c.map(v=> Math.round(Math.max(0,Math.min(255,v*k))));
function zoneX(){                             // 会場を横断する 0..1 の位置
  const keys = Object.keys(zones);
  const i = Math.max(0, keys.indexOf(ZONE));
  return keys.length>1 ? i/(keys.length-1) : 0;
}
function buildEnergyEnv(buf){                 // 1024サンプル毎のRMS(正規化)
  const ch = buf.getChannelData(0), n = Math.floor(ch.length/energyHop);
  const env = new Float32Array(n); let mx = 1e-6;
  for (let i=0;i<n;i++){
    let s=0; const o=i*energyHop;
    for (let j=0;j<energyHop;j+=4){ const v=ch[o+j]; s+=v*v; }
    env[i] = Math.sqrt(s/(energyHop/4)); mx = Math.max(mx, env[i]);
  }
  for (let i=0;i<n;i++) env[i] /= mx;
  return env;
}
function audioLevelNow(){
  if (!energyEnv || !pendingCue || !cueBuf) return 0;
  let pos = serverNowSec() - pendingCue.at - delayMs()/1000;   // 曲内位置(秒)
  if (pos < 0) return 0;
  if (pendingCue.loop) pos = pos % cueBuf.duration;
  else if (pos >= cueBuf.duration) return 0;
  const i = Math.min(energyEnv.length-1, Math.floor(pos*SR/energyHop));
  return energyEnv[i];
}
function lightColor(){
  const t = serverNowSec() - light.at - delayMs()/1000;        // 耳に届く音と同相
  const cols = light.colors.map(hex2rgb);
  const c0 = cols[0], c1 = cols[1] || c0;
  const beat = light.bpm/60, x = zoneX(), B = light.brightness;
  switch (light.pattern){
    case 'solid':  return scaleC(c0, B);
    case 'pulse': {
      const p = (Math.sin(2*Math.PI*beat*t - Math.PI/2)+1)/2;
      return scaleC(mix(c1,c0,p), B*(0.12+0.88*p));
    }
    case 'wave': {                            // ゾーンを横切る光の波
      const p = (Math.sin(2*Math.PI*(t*0.5*light.speed - x*1.5))+1)/2;
      return scaleC(mix(c0,c1,p), B);
    }
    case 'plasma': {                          // 会場全体でうねる面
      const v = (Math.sin(6.283*(x*1.7 + t*0.23*light.speed))
               + Math.sin(6.283*(jitter*2.1 - t*0.17*light.speed))
               + Math.sin(6.283*(x + jitter + t*0.11*light.speed)))/3;
      return scaleC(mix(c0,c1,(v+1)/2), B);
    }
    case 'strobe': {                          // 光過敏対策で3Hz上限
      const hz = Math.min(3, beat);
      const on = (t*hz) % 1 < 0.5;
      return on ? scaleC(c0,B) : [0,0,0];
    }
    case 'audio': {                           // 音のエネルギー→明るさ/色
      const lvl = audioLevelNow();
      return scaleC(mix(c0,c1,Math.min(1,lvl*1.3)), B*(0.06+0.94*lvl));
    }
  }
  return [0,0,0];
}
function lightLoop(){
  if (!light){ lightRAF=0; return; }
  const [r,g,b] = lightColor();
  $('lightLayer').style.background = `rgb(${r},${g},${b})`;
  lightRAF = requestAnimationFrame(lightLoop);
}
function onLight(m){
  light = m;
  $('lightLayer').classList.add('on');
  $('hudZone').textContent = customD ? customD+'m'
    : (autoZone && autoDist!==null) ? `📍${autoDist.toFixed(0)}m` : ZONE;
  $('hudPat').textContent = m.pattern;
  if (cueBuf && !energyEnv) energyEnv = buildEnergyEnv(cueBuf);
  if (!lightRAF) lightLoop();
}
function onLightStop(){
  light = null;
  $('lightLayer').classList.remove('on');
  $('lightHud').classList.remove('show');
}
$('lightLayer').onclick = ()=>{               // タップでHUD表示⇔非表示
  $('lightHud').classList.toggle('show');
};
$('lightExit').textContent = T.exit;
$('lightExit').onclick = e=>{ e.stopPropagation(); onLightStop(); };
// ⛶ / F キー: Mac等でライトを画面フルスクリーンに(MacBook=即席カラーパネル)
function toggleFull(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(()=>{});
}
$('lightFull').onclick = e=>{ e.stopPropagation(); toggleFull(); };
document.addEventListener('keydown', e=>{
  if (e.key==='f' && light) toggleFull();
});

// ---- LIVE MODE (SL2 PCM) — スピーカーノード/近距離WiFi向け ------------------
function onFrame(buf){
  if (!ctx || !active || offsetMs===null) return;
  if (buf.byteLength <= HEADER) return;
  const dv = new DataView(buf);
  const nsamp = dv.getUint32(10, true);
  const playAt = dv.getFloat64(14, true);
  const pcm = new Int16Array(buf, HEADER, nsamp);
  const f32 = new Float32Array(nsamp);
  const vol = $('vol').value/100;
  for (let i=0;i<nsamp;i++) f32[i] = pcm[i] / 32768 * vol;
  // 配信元の実レート(例: Macの44.1kHz)でバッファを作る — 再生時にctxへ自動リサンプル
  const ab = ctx.createBuffer(1, nsamp, srvSr);
  ab.copyToChannel(f32, 0);
  const src = ctx.createBufferSource();
  src.buffer = ab; src.connect(ctx.destination);
  const playAtPerfMs = (playAt + delayMs()/1000)*1000 - offsetMs;
  const deltaSec = (playAtPerfMs - performance.now())/1000;
  const startAt = ctx.currentTime + deltaSec;
  if (startAt < ctx.currentTime + 0.003) return;       // 位相ズレは鳴らさない
  src.start(startAt);
  frames++; $('fr').textContent = frames;
}

// ---- conn -------------------------------------------------------------------
function connect(){
  const proto = location.protocol==='https:' ? 'wss:' : 'ws:';
  const ch = qs.get('ch') || 'festival';
  ws = new WebSocket(`${proto}//${location.host}/audio?role=listen&ch=${encodeURIComponent(ch)}&zone=${ZONE}&pos=${qs.get('pos')||''}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = ()=>{ setLive(true); syncWin.length=0; pingCount=0;
    clearInterval(pingTimer); pingTimer=setInterval(sendPing, 500); sendPing(); };
  ws.onmessage = e=>{
    if (typeof e.data === 'string'){
      const m = JSON.parse(e.data);
      if (m.t==='pong') onPong(m);
      else if (m.t==='config'){ zones=m.zones||zones; baseMs=m.base_ms||0;
        srvSr=m.sr||48000; stageGeo=m.geo||null; renderZones();
        if (stageGeo && autoZone) startGeoWatch();
        if (cueBuf && pendingCue) armCue(); }
      else if (m.t==='cue') onCue(m).catch(err=>{ $('cue').textContent=T.fail; console.error(err); });
      else if (m.t==='preload') onPreload(m);
      else if (m.t==='cue_stop') onCueStop();
      else if (m.t==='light') onLight(m);
      else if (m.t==='light_stop') onLightStop();
    } else onFrame(e.data);
  };
  ws.onclose = ()=>{ setLive(false); if(active) setTimeout(connect, 800 + Math.random()*1200); };
  ws.onerror = ()=>{};
}

function setLive(on){
  $('dot').classList.toggle('live', on);
  $('st').textContent = on ? T.conn : T.idle;
  $('btn').textContent = on ? T.leave : T.join;
  $('btn').classList.toggle('stop', on);
}

async function start(){
  ctx = new (window.AudioContext||window.webkitAudioContext)({sampleRate:SR});
  await ctx.resume();
  // iOSは無音を一度流すとバックグラウンド化に強くなる
  const silent = ctx.createBufferSource();
  silent.buffer = ctx.createBuffer(1, SR, SR); silent.loop = true;
  silent.connect(ctx.destination); silent.start();
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch(e){}
  active = true; frames=0; $('fr').textContent=0;
  connect();
  if (stageGeo && autoZone) startGeoWatch();   // 参加タップ=ユーザー起点で位置許可を出す
}
function stop(){
  active=false; onCueStop(); onLightStop(); stopGeoWatch();
  if(ws){try{ws.close()}catch(e){}}
  if(ctx){try{ctx.close()}catch(e){}} ctx=null;
  try{ wakeLock?.release(); }catch(e){}
  clearInterval(pingTimer);
  setLive(false);
}
$('btn').onclick = ()=> active ? stop() : start();
$('vol').oninput = ()=>{ if (cueGainNode && pendingCue) cueGainNode.gain.value = (pendingCue.gain??1) * ($('vol').value/100); };
document.addEventListener('visibilitychange', ()=>{      // 画面復帰時に再同期
  if (!document.hidden && active && ctx){ ctx.resume(); sendPing(); if (cueBuf && pendingCue) armCue(); }
});
renderZones();
</script>
</body>
</html>
